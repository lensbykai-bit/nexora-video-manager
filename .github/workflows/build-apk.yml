name: Build MovieScript Dub AI APK

on:
  push:
    branches: [ "moviescript-dub-ai-apk" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MovieScript-Dub-AI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieScript-Dub-AI-APK
          path: MovieScript-Dub-AI.apk
          if-no-files-found: error
